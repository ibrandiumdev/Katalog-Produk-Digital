<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk Digital - Protoype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #2563eb 0%, #10b981 100%); }
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .product-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
        /* Sembunyikan scrollbar untuk kategori pada mobile */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

    <header class="gradient-bg text-white sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold flex items-center gap-2">
                        <i data-lucide="shopping-bag"></i> MyKatalog
                    </h1>
                    <p class="text-sm opacity-90">Katalog Digital Pintar & Pantas</p>
                </div>
                
                <!-- Search Bar -->
                <div class="relative flex-1 max-w-md">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </span>
                    <input 
                        type="text" 
                        id="searchInput"
                        placeholder="Cari nama produk..." 
                        class="w-full pl-10 pr-4 py-2 rounded-full text-gray-900 focus:ring-2 focus:ring-blue-300 outline-none shadow-inner"
                    >
                </div>
            </div>
        </div>
    </header>

    <section class="container mx-auto px-4 py-6">
        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2" id="categoryFilters">
            <button onclick="filterProducts('Semua')" class="category-btn active px-6 py-2 rounded-full bg-blue-600 text-white font-medium shadow-md">Semua</button>
            <button onclick="filterProducts('Makanan')" class="category-btn px-6 py-2 rounded-full bg-white text-gray-600 hover:bg-gray-100 font-medium border shadow-sm">Makanan</button>
            <button onclick="filterProducts('Kecantikan')" class="category-btn px-6 py-2 rounded-full bg-white text-gray-600 hover:bg-gray-100 font-medium border shadow-sm">Kecantikan</button>
            <button onclick="filterProducts('Hadiah')" class="category-btn px-6 py-2 rounded-full bg-white text-gray-600 hover:bg-gray-100 font-medium border shadow-sm">Hadiah</button>
            <button onclick="filterProducts('Elektronik')" class="category-btn px-6 py-2 rounded-full bg-white text-gray-600 hover:bg-gray-100 font-medium border shadow-sm">Elektronik</button>
        </div>
    </section>

    <main class="container mx-auto px-4 pb-20">
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Produk akan dijana oleh JavaScript -->
        </div>

        <!-- Mesej jika tiada produk ditemui -->
        <div id="noResults" class="hidden text-center py-20">
            <i data-lucide="package-search" class="w-16 h-16 mx-auto text-gray-300 mb-4"></i>
            <h3 class="text-xl font-semibold text-gray-500">Produk tidak ditemui</h3>
            <p class="text-gray-400">Sila cuba kata kunci carian yang lain.</p>
        </div>
    </main>

    <script>
        const products = [
            { id: 1, name: "Nasi Lemak Royale", price: 12.00, category: "Makanan", image: "https://placehold.co/400x300/e2e8f0/1e293b?text=Nasi+Lemak" },
            { id: 2, name: "Serum Muka Vitamin C", price: 45.00, category: "Kecantikan", image: "https://placehold.co/400x300/e2e8f0/1e293b?text=Serum+Vitamin+C" },
            { id: 3, name: "Kotak Hadiah Premium", price: 85.00, category: "Hadiah", image: "https://placehold.co/400x300/e2e8f0/1e293b?text=Gift+Box" },
            { id: 4, name: "Kek Coklat Moist", price: 25.00, category: "Makanan", image: "https://placehold.co/400x300/e2e8f0/1e293b?text=Kek+Coklat" },
            { id: 5, name: "Lipmatte Edisi Terhad", price: 30.00, category: "Kecantikan", image: "https://placehold.co/400x300/e2e8f0/1e293b?text=Lipmatte" },
            { id: 6, name: "Jam Tangan Pintar", price: 150.00, category: "Elektronik", image: "https://placehold.co/400x300/e2e8f0/1e293b?text=Smartwatch" },
            { id: 7, name: "Sambal Garing Ikan Bilis", price: 15.00, category: "Makanan", image: "https://placehold.co/400x300/e2e8f0/1e293b?text=Sambal+Garing" },
            { id: 8, name: "Set Skincare Organik", price: 120.00, category: "Kecantikan", image: "https://placehold.co/400x300/e2e8f0/1e293b?text=Skincare+Set" }
        ];

        let currentCategory = 'Semua';
        let searchQuery = '';

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const noResults = document.getElementById('noResults');
            
            const filtered = products.filter(p => {
                const matchesCategory = currentCategory === 'Semua' || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                noResults.classList.remove('hidden');
            } else {
                grid.classList.remove('hidden');
                noResults.classList.add('hidden');
                
                grid.innerHTML = filtered.map(product => `
                    <div class="product-card bg-white rounded-2xl overflow-hidden shadow-md border border-gray-100 flex flex-col">
                        <div class="relative h-48 overflow-hidden bg-gray-200">
                            <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover">
                            <span class="absolute top-3 right-3 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-xs font-bold text-blue-600 shadow-sm">
                                ${product.category}
                            </span>
                        </div>
                        <div class="p-5 flex-1 flex flex-col">
                            <h3 class="text-lg font-bold text-gray-800 mb-1 leading-tight">${product.name}</h3>
                            <p class="text-2xl font-bold text-green-600 mb-4">RM ${product.price.toFixed(2)}</p>
                            <button 
                                onclick="orderWhatsApp('${product.name}', ${product.price})"
                                class="mt-auto w-full py-3 bg-green-500 hover:bg-green-600 text-white rounded-xl font-semibold flex items-center justify-center gap-2 transition-colors shadow-lg shadow-green-100"
                            >
                                <i data-lucide="message-circle" class="w-5 h-5"></i>
                                Order Sekarang
                            </button>
                        </div>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        }

        function filterProducts(category) {
            currentCategory = category;
            
            // Update UI buttons
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                if(btn.innerText === category) {
                    btn.classList.add('bg-blue-600', 'text-white');
                    btn.classList.remove('bg-white', 'text-gray-600');
                } else {
                    btn.classList.remove('bg-blue-600', 'text-white');
                    btn.classList.add('bg-white', 'text-gray-600');
                }
            });
            
            renderProducts();
        }

        function orderWhatsApp(name, price) {
            const phone = "60123456789"; // Gantikan dengan nombor telefon anda
            const message = `Hai, saya ingin pesan *${name}* yang berharga *RM ${price.toFixed(2)}*. Adakah stok masih tersedia?`;
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderProducts();
        });

        // Initialize icons and render
        window.onload = () => {
            lucide.createIcons();
            renderProducts();
        };
    </script>

    <!-- Footer Simple -->
    <footer class="bg-gray-100 border-t py-8 mt-12">
        <div class="container mx-auto px-4 text-center text-gray-500 text-sm">
            <p>&copy; 2024 MyKatalog Prototype. Bina dengan ❤️ untuk bisnes anda.</p>
        </div>
    </footer>

</body>
</html>
